name: Easel cache volume
description: Keep paths on the repository's Easel cache volume across jobs, with no download or untar (on an Easel runner).
inputs:
  path:
    description: Paths to keep on the volume, one per line. `~` is the home directory; relative paths are from the workspace.
    required: true
  key:
    description: The volume's name in this repository (one per key, at most 4 per job). Jobs with the same key share it.
    required: false
    default: default
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: always()
branding:
  icon: hard-drive
  color: gray-dark
